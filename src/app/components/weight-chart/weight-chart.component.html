<div class="wc-root">
  <!-- Previous full-screen empty state for babies over 5 years, kept for reuse
  <div class="wc-empty" *ngIf="outOfRange" role="status">
    <ion-icon name="stats-chart-outline" aria-hidden="true"></ion-icon>
    <h4>WHO charts cover birth to 5 years</h4>
    <p>Your recorded entries are still saved in growth history.</p>
  </div>
  -->
  <p class="wc-note" *ngIf="outOfRange" role="status">WHO percentile curves cover birth to 5 years, so only your entries are shown.</p>
  <div #chartContainer class="wc-chart" role="img" [attr.aria-label]="summary"></div>
  <p class="wc-hint" *ngIf="points.length === 0">No {{ kind === 'weight' ? 'weight' : 'height' }} entries yet.<ng-container *ngIf="!outOfRange"> Curves show WHO percentiles for {{ sexLabel.toLowerCase() }}s.</ng-container></p>
  <p class="wc-hint" *ngIf="points.length > 0">Tap a point for details.<ng-container *ngIf="!outOfRange"> Lines show WHO percentiles.</ng-container></p>
</div>
