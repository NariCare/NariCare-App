<ion-content [fullscreen]="true">
  <div class="content-container">

    <!-- Hero Banner -->
    <div class="hero-banner">
      <ion-icon name="sparkles" class="hero-icon"></ion-icon>
      <h1>Knowledge</h1>
      <p>Trusted guidance for your motherhood journey</p>
      <span class="hero-tagline">Small steps, brighter days</span>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <ion-searchbar
        [(ngModel)]="searchTerm"
        placeholder="Search articles, tips, and guides..."
        (ionInput)="onSearchChange($event)"
        (ionFocus)="onSearchFocus()"
        class="custom-searchbar">
      </ion-searchbar>
    </div>

    <!-- Topic Grid -->
    <div class="topic-grid">
      <div
        *ngFor="let category of categories$ | async"
        class="topic-tile"
        [style.background-image]="'url(' + illustrationFor(category.id) + ')'"
        (click)="onCategorySelect(category.id)">
        <div class="topic-tile-scrim"></div>
        <h2>{{ category.name }}</h2>
      </div>
    </div>

  </div>
</ion-content>
