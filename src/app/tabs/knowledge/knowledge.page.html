<ion-content [fullscreen]="true">
  <div class="content-container">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-header-text">
        <h1>Knowledge Section</h1>
        <p>Each card gives a quick, scannable preview of helpful content.</p>
      </div>
      <ion-button fill="clear" class="see-all-pill" (click)="onSearchFocus()">
        See all
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-button>
    </div>

    <!-- Search Bar -->
    <div class="search-section">
      <ion-searchbar
        [(ngModel)]="searchTerm"
        placeholder="Search articles, tips, and guides..."
        (ionInput)="onSearchChange($event)"
        (ionFocus)="onSearchFocus()"
        class="custom-searchbar">
      </ion-searchbar>
    </div>

    <!-- Articles by Category -->
    <div *ngFor="let categoryGroup of categorizedArticles$ | async" class="category-section">
      <div class="section-header">
        <h2 class="section-title">{{ categoryGroup.category.name }}</h2>
        <ion-button
          fill="clear"
          size="small"
          class="see-all-button"
          (click)="onSeeAllCategory(categoryGroup.category.id)">
          See all
        </ion-button>
      </div>

      <div class="articles-grid">
        <div
          *ngFor="let article of categoryGroup.articles"
          class="article-card"
          [ngClass]="getCardTheme(article.id).className"
          (click)="onArticleSelect(article)">
          <div class="article-illustration">
            <img [src]="getCardTheme(article.id).illustration" alt="">
          </div>
          <ion-chip class="difficulty-chip">{{ article.difficulty | titlecase }}</ion-chip>
          <h3>{{ article.title }}</h3>
          <p>{{ article.summary }}</p>
          <div class="article-footer">
            <span class="read-time">
              <ion-icon name="time-outline"></ion-icon>
              {{ formatReadTime(article.readTime) }}
            </span>
            <ion-button fill="clear" size="small" class="bookmark-button" [class.saved]="isBookmarked(article.id)" (click)="toggleBookmark(article.id, $event)">
              <ion-icon [name]="isBookmarked(article.id) ? 'bookmark' : 'bookmark-outline'" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </div>
      </div>
    </div>

  </div>
</ion-content>
