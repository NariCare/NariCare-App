<ion-content [fullscreen]="true">
  <div class="content-container" *ngIf="category$ | async as category">

    <!-- Topic Hero -->
    <div class="topic-hero" [style.background-image]="'url(' + illustrationFor(category.id) + ')'">
      <div class="topic-hero-scrim"></div>
      <button type="button" class="back-button" (click)="goBack()" aria-label="Back">
        <ion-icon name="arrow-back" aria-hidden="true"></ion-icon>
      </button>
      <div class="topic-hero-text">
        <h1>{{ category.name }}</h1>
        <p>{{ category.description }}</p>
      </div>
    </div>

    <!-- Sub-topic list -->
    <div class="topic-list">
      <div
        *ngFor="let article of articles$ | async"
        class="topic-row"
        (click)="onArticleSelect(article)">
        <div class="topic-row-thumb" [style.background-image]="'url(' + illustrationFor(category.id) + ')'"></div>
        <span class="topic-row-title">{{ article.title }}</span>
        <ion-icon name="chevron-forward" class="topic-row-arrow"></ion-icon>
      </div>
    </div>

  </div>
</ion-content>
